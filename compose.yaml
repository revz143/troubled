services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -lc "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - hinga_node_modules:/app/node_modules
      - hinga_next:/app/.next
      - hinga_pnpm_store:/pnpm/store

volumes:
  hinga_node_modules:
  hinga_next:
  hinga_pnpm_store:
